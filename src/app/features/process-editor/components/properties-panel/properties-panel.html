<div class="p-4">
  <h2 class="text-sm font-semibold">Propiedades</h2>

  @if (element(); as selected) {
    <div class="mt-3 space-y-3 text-sm">
      <dl>
        <dt class="text-content-muted">Tipo</dt>
        <dd>{{ selected.type }}</dd>
      </dl>

      <div>
        <label for="element-id" class="text-content-muted">ID</label>
        <input
          #id
          id="element-id"
          type="text"
          class="mt-1 w-full rounded-control border px-2 py-1.5 font-mono focus-visible:outline-2 focus-visible:outline-focus-ring"
          [class.border-border]="!idError()"
          [class.border-danger]="idError()"
          [attr.aria-invalid]="idError() ? 'true' : null"
          aria-describedby="element-id-error"
          [value]="selected.id"
          (input)="checkId(id.value)"
          (change)="changeId(id.value)"
        />
        @if (idError(); as error) {
          <p id="element-id-error" role="alert" class="mt-1 text-danger">{{ error }}</p>
        }
      </div>

      <div>
        <label for="element-name" class="text-content-muted">Nombre</label>
        <input
          #name
          id="element-name"
          type="text"
          class="mt-1 w-full rounded-control border border-border px-2 py-1.5 focus-visible:outline-2 focus-visible:outline-focus-ring"
          [value]="selected.name ?? ''"
          (change)="rename(name.value)"
        />
      </div>
    </div>
  } @else {
    <p class="mt-1 text-sm text-content-muted">Seleccione un elemento para ver sus propiedades.</p>
  }
</div>
