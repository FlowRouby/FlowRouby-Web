<div class="p-4">
  <h2 class="text-sm font-semibold">Properties</h2>

  @if (element(); as selected) {
    <div class="mt-3 space-y-3 text-sm">
      <dl class="space-y-3">
        <div>
          <dt class="text-content-muted">Type</dt>
          <dd>{{ selected.type }}</dd>
        </div>
        <div>
          <dt class="text-content-muted">ID</dt>
          <dd class="break-all font-mono">{{ selected.id }}</dd>
        </div>
      </dl>

      <label class="block">
        <span class="text-content-muted">Name</span>
        <input
          #name
          type="text"
          class="mt-1 w-full rounded-control border border-border px-2 py-1.5 focus-visible:outline-2 focus-visible:outline-focus-ring"
          [value]="selected.name ?? ''"
          (change)="rename(name.value)"
        />
      </label>
    </div>
  } @else {
    <p class="mt-1 text-sm text-content-muted">Select an element to see its properties.</p>
  }
</div>
