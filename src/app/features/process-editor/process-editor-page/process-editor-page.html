<div class="flex h-full flex-col">
  <header class="flex items-center justify-between border-b border-border bg-surface px-4 py-2">
    <div class="head-logo flex flex-row items-center gap-2">
      <img src="FlowRouby-Logo.png" alt="Logotipo de FlowRouby" class="h-8 w-auto"/>
          <h1 class="text-base font-semibold text-primary">FlowRouby</h1>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" class="rounded-control border border-border px-3 py-1 text-sm hover:bg-primary-soft aria-pressed:bg-primary-soft aria-pressed:text-primary focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-pressed]="analysisOpen()" (click)="analysisOpen.set(!analysisOpen())">Análisis</button>
      <button type="button" class="rounded-control border border-border px-3 py-1 text-sm hover:bg-primary-soft aria-pressed:bg-primary-soft aria-pressed:text-primary focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-pressed]="propertiesOpen()" (click)="propertiesOpen.set(!propertiesOpen())">Propiedades</button>
    </div>
  </header>

  <app-editor-toolbar />

  <div class="flex min-h-0 flex-1">
    <main class="flex min-w-0 flex-1 flex-col">
      <app-bpmn-canvas class="min-h-0 flex-1" />

      @if (analysisOpen()) {
        <section aria-label="Análisis" class="relative flex shrink-0 flex-col border-t border-border bg-surface p-4" [style.height.px]="analysisHeight()">
          <div role="separator" aria-orientation="horizontal" aria-label="Cambiar el alto del panel de análisis" tabindex="0" class="absolute inset-x-0 top-0 h-2 -translate-y-1/2 cursor-row-resize touch-none hover:bg-primary-soft focus-visible:bg-primary-soft focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-valuenow]="analysisHeight()" [attr.aria-valuemin]="minAnalysisHeight" [attr.aria-valuemax]="maxAnalysisHeight" (pointerdown)="startResize($event)" (pointermove)="dragResize($event)" (pointerup)="endResize()" (pointercancel)="endResize()" (keydown)="resizeWithKey($event)"></div>
          <div class="mb-2 flex items-center justify-between">
            <h2 class="text-sm font-semibold">Análisis</h2>
            <button type="button" class="rounded-control border border-border px-3 py-1 text-sm hover:bg-primary-soft focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-pressed]="analysisExpanded()" (click)="toggleAnalysisSize()">{{ analysisExpanded() ? 'Reducir panel' : 'Ampliar panel' }}</button>
          </div>
          <app-analysis-tabs class="min-h-0 flex-1" />
        </section>
      }
    </main>

    @if (propertiesOpen()) {
      <aside aria-label="Propiedades" class="w-72 shrink-0 border-l border-border bg-surface">
        <app-properties-panel />
      </aside>
    }
  </div>
</div>
