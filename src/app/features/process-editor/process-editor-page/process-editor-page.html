<div class="flex h-full flex-col">
  <header class="flex items-center justify-between border-b border-border bg-surface px-4 py-2">
    <div class="head-logo flex flex-row items-center gap-2">
      <img src="FlowRouby-Logo.png" alt="FlowRouby Logo" class="h-8 w-auto"/>
          <h1 class="text-base font-semibold text-primary">FlowRouby</h1>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" class="rounded-control border border-border px-3 py-1 text-sm hover:bg-primary-soft aria-pressed:bg-primary-soft aria-pressed:text-primary focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-pressed]="analysisOpen()" (click)="analysisOpen.set(!analysisOpen())">Analysis</button>
      <button type="button" class="rounded-control border border-border px-3 py-1 text-sm hover:bg-primary-soft aria-pressed:bg-primary-soft aria-pressed:text-primary focus-visible:outline-2 focus-visible:outline-focus-ring" [attr.aria-pressed]="propertiesOpen()" (click)="propertiesOpen.set(!propertiesOpen())">Properties</button>
    </div>
  </header>

  <app-editor-toolbar />

  <div class="flex min-h-0 flex-1">
    <main class="flex min-w-0 flex-1 flex-col">
      <app-bpmn-canvas class="min-h-0 flex-1" />

      @if (analysisOpen()) {
        <section aria-label="Analysis" class="h-48 shrink-0 border-t border-border bg-surface p-4">
          <h2 class="text-sm font-semibold">Analysis</h2>
          <p class="mt-1 text-sm text-content-muted">Analysis results will appear here.</p>
        </section>
      }
    </main>

    @if (propertiesOpen()) {
      <aside aria-label="Properties" class="w-72 shrink-0 border-l border-border bg-surface">
        <app-properties-panel />
      </aside>
    }
  </div>
</div>
